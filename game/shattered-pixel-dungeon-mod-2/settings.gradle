// === Place these lines at the VERY TOP of settings.gradle (Groovy DSL) ===
// Must come before pluginManagement {}, dependencyResolutionManagement {}, and any other blocks.
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.9.0'
}

//core game code modules
include ':SPD-classes'
include ':core'

//platform modules
if ({ def s = System.getenv('ANDROID_HOME') ?: System.getenv('ANDROID_SDK_ROOT'); def lp = new File(settingsDir, 'local.properties'); if (!s && lp.exists()) { def pp = new Properties(); lp.withInputStream { pp.load(it) }; s = pp.getProperty('sdk.dir') }; s != null && new File(s.toString()).exists() }()) // >>> pdmaker
include ':android'
include ':ios'
include ':desktop'

//service modules
include ':services'
    //updates
    include ':services:updates:debugUpdates'
    include ':services:updates:githubUpdates'
    //news
    include ':services:news:debugNews'
    include ':services:news:shatteredNews'